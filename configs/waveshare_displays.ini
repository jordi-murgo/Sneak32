[env:waveshare-esp32-s3-lcd-5b]
; Waveshare ESP32-S3-Touch-LCD-5B (5" 800x480 IPS display)
; https://www.waveshare.com/esp32-s3-touch-lcd-5.htm
board = esp32-s3-devkitm-1
build_flags =
  -DENABLE_LED=0
  -DENABLE_DISPLAY=1
  -DLV_CONF_INCLUDE_SIMPLE=1
  -DLCD_WIDTH=800
  -DLCD_HEIGHT=480
  -DUSER_SETUP_LOADED=1
  -DILI9488_DRIVER=1
  -DTFT_MISO=13
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=14
  -DTFT_RST=21
  -DTFT_BL=2
  -DTOUCH_CS=16
debug_tool = esp-builtin
upload_protocol = esp-builtin
upload_speed = 460800

